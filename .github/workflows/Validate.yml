name: Validate pull requests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm install

      - name: Build site
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Static site requires no build
        if: hashFiles('package.json') == ''
        run: echo "No package.json found; nothing to compile."
